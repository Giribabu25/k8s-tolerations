---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swiggy

  template:
    metadata:
      labels:
        app: swiggy

    spec:
      containers:
        - name: cont-1
          image: nginx
          ports:
            - containerPort: 80
          volumeMounts:
            - name: mydata
              mountPath: /var/lib/mysql

      volumes:
        - name: mydata
          persistentVolumeClaim:
            claimName: mysql-data

